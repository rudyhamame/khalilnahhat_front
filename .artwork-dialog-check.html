<!doctype html><html><head><title>Artwork dialog regression check</title></head><body><output id="upload-check" hidden></output><div id="root"></div><script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import AdminWorkspace from './src/components/AdminWorkspace.jsx';
import Archive from './src/echo/OntologyArchiveAdmin.jsx';
import './src/components/adminWorkspace.css';
let attempts=0;
globalThis.fetch=async(input,options={})=>{
 const path=new URL(String(input),location.origin).pathname;
 if(path.endsWith('/admin/music-archive/upload')){
  attempts++;
  const file=options.body.get('file');
  const image=await createImageBitmap(file);
  document.querySelector('#upload-check').textContent=JSON.stringify({attempts,type:file.type,width:image.width,height:image.height});
  image.close();
  if(attempts===1)return Response.json({message:'Simulated upload failure. Try again.'},{status:500});
  return Response.json({url:'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAAAFElEQVR4nGPoIBEwjGoY1TB8NQAA56CYELcsjfQAAAAASUVORK5CYII=',previewUrl:'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAAAFElEQVR4nGPoIBEwjGoY1TB8NQAA56CYELcsjfQAAAAASUVORK5CYII='});
 }
 if(path.endsWith('/admin/music-archive'))return Response.json({collections:[],songs:[]});
 if(/\/admin\/music-ontology\/(recordings|works|vocabulary)$/.test(path))return Response.json({items:[]});
 return Response.json({message:'Unexpected request in isolated check'},{status:404});
};
createRoot(document.querySelector('#root')).render(React.createElement(AdminWorkspace,{activeKey:'music-archive',username:'Artwork check'},React.createElement(Archive,{token:'local-check-only'})));
</script></body></html>
