<!doctype html><html><head><title>Email operations review</title><style>html,body,#root{height:100%;margin:0;background:#202123}.admin-workspace.review{display:flex;height:100%;background:#202123;color:#e9e9ec}</style></head><body><div id="root"></div><script type="module">
import React from 'react';import{createRoot}from'react-dom/client';import AdminEmail from '/src/echo/AdminEmail.jsx';import '/src/components/adminWorkspace.css';
const folders=[{id:'1',type:'Inbox',name:'Inbox',total:14,unread:3},{id:'2',type:'Sent',name:'Sent',total:31,unread:0},{id:'4',type:'Unconfirmed',name:'Unconfirmed',total:2,unread:0},{id:'5',type:'Archive',name:'Archive',total:8,unread:0},{id:'3',type:'Trash',name:'Trash',total:1,unread:0}];
const messages=[{id:'a1',folderId:'1',from:'client@example.com',sender:'Maya Chen',to:'bookings@djkhalilnahhat.ca',subject:'Wedding reception availability',summary:'Hi Khalil, we are planning our reception for next summer.',time:Date.now()-3600000,attachments:true,read:false},{id:'a2',folderId:'1',from:'planner@example.com',sender:'Event planner',to:'bookings@djkhalilnahhat.ca',subject:'Updated venue schedule',summary:'The venue has confirmed access from 3 PM.',time:Date.now()-86400000,attachments:false,read:true}];
window.fetch=async(input,options={})=>{const url=String(input),body=options.body&&JSON.parse(options.body);let data={};if(url.endsWith('/status'))data={provider:'Cloudflare + Brevo',mailbox:'bookings@djkhalilnahhat.ca',configured:true,receivingConfigured:true,sendingConfigured:true,active:true,automation:{configured:true},capabilities:{search:true,read:true,move:true,remove:true}};else if(url.endsWith('/folders'))data={items:folders};else if(url.endsWith('/storage'))data={usedBytes:2457600,limitBytes:52428800};else if(url.includes('/messages?'))data={items:messages};else if(url.includes('/messages/a1')&&!url.endsWith('/read'))data={item:{...messages[0],replyTo:'client@example.com',cc:'planner@example.com',text:'Hi Khalil,\n\nWe are planning our reception for next summer. Are you available on August 14?\n\nThank you,\nMaya',attachments:[{id:'f1',name:'venue-schedule.pdf',size:245000}]}};else if(url.endsWith('/read'))data={confirmed:true};else if(url.endsWith('/send')&&options.method==='POST')data={sent:true,messageId:'sent-1',requestId:body?.requestId};else data={};return new Response(JSON.stringify(data),{status:200,headers:{'Content-Type':'application/json'}})};
createRoot(document.getElementById('root')).render(React.createElement('main',{className:'admin-workspace review','data-area':'email'},React.createElement('div',{className:'aw-content'},React.createElement(AdminEmail,{token:'review',user:{id:'admin-review'}}))));
</script></body></html>
