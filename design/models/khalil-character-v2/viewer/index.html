<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khalil 3D head</title>
<style>
html,body{margin:0;height:100%;background:#0c1012;color:#dfe7e3;font:14px/1.4 system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.bar{position:fixed;left:16px;top:16px;display:flex;gap:8px;flex-wrap:wrap;z-index:2}
button{padding:8px 14px;border-radius:99px;border:1px solid #ffffff30;background:#11171acc;color:inherit;cursor:pointer;backdrop-filter:blur(6px)}
button[aria-pressed=true]{background:#e8f1ec;color:#0c1012}
#msg{position:fixed;left:16px;bottom:16px;font-size:12px;opacity:.75;z-index:2;max-width:70ch}
</style></head><body>
<canvas id="c"></canvas>
<div class="bar">
 <button data-view="front">Front</button><button data-view="three">¾</button><button data-view="side">Profile</button><button data-view="back">Back</button>
 <button id="hair" aria-pressed="true">Hair</button><button id="beard" aria-pressed="true">Beard</button><button id="spin" aria-pressed="false">Auto-rotate</button>
</div>
<div id="msg">Loading…</div>
<script type="module" src="./viewer.js"></script>
</body></html>
